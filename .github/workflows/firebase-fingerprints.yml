
name: Firebase Android Fingerprints

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android fingerprints
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:signingReport --no-daemon

