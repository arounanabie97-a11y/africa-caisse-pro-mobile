
name: Firebase Android Fingerprints

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Create debug keystore if missing
        run: |
          mkdir -p "$HOME/.config/.android"
          if [ ! -f "$HOME/.config/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.config/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate Android fingerprints
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:signingReport --no-daemon
