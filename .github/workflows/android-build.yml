name: AFRICA CAISSE PRO - Version Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Generate Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check required project files
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/africa/caissepro/MainActivity.kt
          test -f app/google-services.json

      - name: Validate Android manifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          manifest = "app/src/main/AndroidManifest.xml"
          try:
              ET.parse(manifest)
              print(f"{manifest}: XML is valid")
          except ET.ParseError as error:
              raise SystemExit(f"{manifest}: {error}")
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --info --console=plain :app:assembleDebug

      - name: Upload build reports if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AFRICA-CAISSE-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
